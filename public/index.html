<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evergrove Wellness Showcase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="An interactive showcase of a wellness business platform, with sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Marcellus&family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%233B5A44'/%3E%3Cpath d='M16 7c5 3 7 8 5 13-1.5 3.5-5 5-5 5s-3.5-1.5-5-5C9 15 11 10 16 7z' fill='%23F3F5F0'/%3E%3C/svg%3E">
<!--STYLE--><link rel="stylesheet" href="app.css"><!--/STYLE-->
</head>
<body>
  <header class="top">
    <a class="brand" href="#dashboard" aria-label="Evergrove Wellness dashboard">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="var(--deep)"/><path d="M16 7c5 3 7 8 5 13-1.5 3.5-5 5-5 5s-3.5-1.5-5-5C9 15 11 10 16 7z" fill="var(--bg)"/><path d="M16 11v13" stroke="var(--deep)" stroke-width="1.4"/></svg>
      <b>Evergrove Wellness</b>
    </a>
    <span class="sample" title="Every name, order and number here is invented">Showcase &middot; sample data</span>
    <span class="grow"></span>
    <span class="tools"><button class="linkish" id="resetBtn" type="button">Reset sample data</button></span>
    <button class="btn-play" id="playBtn" type="button" title="Plays a 2&ndash;3 minute guided tour. Restores the sample data first.">
      <span class="dot"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></span>
      Play Showcase
    </button>
  </header>
  <div class="shell">
    <nav class="rail" aria-label="Sections">
      <div class="group">Run the practice</div>
      <button class="nav" data-view="dashboard" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
      <button class="nav" data-view="schedule" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
      <button class="nav" data-view="clients" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.3 3.3 0 0 1 0 6.5M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>Clients</button>
      <button class="nav" data-view="messages" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5 12 13l8.5-6.5"/></svg>Client messaging</button>
      <div class="group">Paperwork</div>
      <button class="nav" data-view="intake" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h4"/></svg>Wellness intake</button>
      <button class="nav" data-view="agreements" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 17c1-1.2 2-1.2 3 0s2 1.2 3 0"/></svg>Quotes &amp; agreements</button>
      <div class="group">Grow</div>
      <button class="nav" data-view="newsletter" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5"/></svg>Newsletter<span class="new">NEW</span></button>
      <button class="nav" data-view="shop" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18l-1.5 12a2 2 0 0 1-2 1.8h-11a2 2 0 0 1-2-1.8z"/><path d="M8.5 7a3.5 3.5 0 0 1 7 0"/></svg>Shop &amp; fulfilment<span class="new">NEW</span></button>
      <button class="nav" data-view="videos" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg>Video library<span class="new">NEW</span></button>
    </nav>
    <main class="main"><div class="view" id="view"></div></main>
  </div>
  <div id="drawerRoot"></div>
  <div class="toast" id="toast" role="status" hidden></div>
<!--SCRIPTS--><script src="data.js"></script>
<script src="app.js"></script>
<script src="tour.js"></script><!--/SCRIPTS-->
</body>
</html>
